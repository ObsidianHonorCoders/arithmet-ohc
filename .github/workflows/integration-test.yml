name: integration-test

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-test-and-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Toolchain preflight
        run: |
          cmake --version
          ctest --version

      - name: Compiler preflight (non-Windows)
        if: runner.os != 'Windows'
        run: c++ --version
      - name: Build & Run Script
        run: cmake -DBUILD_TESTS=ON -P build_and_run_project.cmake
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            build/**/Testing/**
            build/**/Test.xml
            build/**/CMakeOutput.log
            build/**/CMakeError.log
